<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up Test</title>

    <style>
      body {
        font-family: sans-serif;
        background: #f2f2f2;
        padding: 40px;
      }

      form {
        width: 360px;
        padding: 12px;
        border: 1px solid #000;
        background: #fff;
      }

      label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
      }

      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 4px;
      }

      button {
        margin-top: 16px;
        background: #000;
        color: #fff;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>註冊測試</h2>

    <form
      method="POST"
      action="https://script.google.com/macros/s/AKfycbxLLxgXIqKYGOlwLXwHCpNqJSXwFx8Mhr13nc4gMrbd8XctycrTf7tlEumEFpmxPkng/exec"
      target="_blank"
    >
      <input type="hidden" name="action" value="register" />

      <label>Email / account</label>
      <input
        type="email"
        name="account"
        value="test_static_001@example.com"
        required
      />

      <label>Password</label>
      <input
        type="password"
        name="password"
        value="123456"
        required
      />

      <label>Phone</label>
      <input
        type="text"
        name="phone"
        value="0912345678"
        required
      />

      <label>Name</label>
      <input
        type="text"
        name="name"
        value="靜態網站測試"
        required
      />

      <label>Region</label>
      <select name="region" required>
        <option value="TW" selected>TW</option>
        <option value="JP">JP</option>
        <option value="KR">KR</option>
        <option value="IT">IT</option>
        <option value="OTHER">OTHER</option>
      </select>

      <button type="submit">送出測試</button>
    </form>
  </body>
</html>
