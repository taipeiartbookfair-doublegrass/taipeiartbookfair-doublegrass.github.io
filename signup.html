<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
         script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://code.jquery.com https://www.googletagmanager.com;
         style-src 'self' 'unsafe-inline';
         img-src 'self' data: blob:;
         connect-src https://www.google-analytics.com https://script.google.com https://script.googleusercontent.com;
         frame-src https://www.google.com https://script.google.com https://script.googleusercontent.com;"
    />

    <title>Sign Up - 草率季Taipei Art Book Fair</title>

    <link rel="shortcut icon" href="image/icon-1.ico" />
    <link rel="stylesheet" href="css/font.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-EPSXJPDH6L"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-EPSXJPDH6L");
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
        position: relative;
        background-color: #f2f2f2;
      }

      .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 80vh;
        padding: 0 10px;
      }

      h2 {
        font-size: 1rem;
        font-weight: normal;
        text-transform: uppercase;
        margin-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        color: black;
        background-color: ghostwhite;
        border: 1px solid black;
        text-align: left;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 380px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
      }

      .input-box {
        display: flex;
        flex-direction: column;
        margin-bottom: 8px;
        padding: 4px;
        border: 1px solid #000;
      }

      .input-box label {
        font-size: 12px;
        color: black;
        margin-bottom: 2px;
      }

      .input-box input,
      .input-box select {
        padding: 6px;
        font-size: 12px;
        border: 1px solid #000;
      }

      .input-box input:focus,
      .input-box select:focus {
        background-color: olive;
        outline: none;
      }

      .sub-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
        padding-right: 6px;
      }

      .fp {
        padding-left: 5px;
        padding-right: 5px;
        font-size: 0.8rem;
        text-decoration: underline;
        color: grey;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .submit-box {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      button {
        padding: 8px;
        background-color: black;
        color: white;
        border: none;
        width: 100%;
        text-align: center;
        cursor: pointer;
        letter-spacing: 1px;
        font-size: 0.9rem;
      }

      button:hover {
        color: palegreen;
        background-color: olive;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .bgimg {
        filter: saturate(500) hue-rotate(185deg) contrast(200%) brightness(90%)
          sepia(25%);
        position: fixed;
        z-index: -50;
        width: 100vw;
        height: 100vh;
        -webkit-user-drag: none;
        top: 0;
        left: 0;
      }

      .back {
        font-size: 0.9rem;
        font-family: "Inclusive Sans", sans-serif;
        overflow: hidden;
        color: black;
        background-color: white;
        white-space: nowrap;
        position: fixed;
        bottom: 0px;
        left: 0px;
        padding: 5px;
        text-align: center;
        font-weight: 500;
        cursor: pointer;
      }

      #signup-status {
        display: none;
        width: 100%;
        max-width: 380px;
        margin-top: 8px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
        color: black;
        font-size: 0.8rem;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .form-fields-hidden {
        display: none;
      }

      .form-fields-visible {
        display: flex;
        flex-direction: column;
      }

      .password-rules {
        font-size: 0.72rem;
        line-height: 1.35;
        margin-top: 4px;
        color: plum;
      }

      .verification-actions {
        display: flex;
        gap: 6px;
      }

      .verification-actions input {
        flex: 1;
      }

      .verification-actions button {
        width: auto;
        min-width: 110px;
        font-size: 0.75rem;
      }

      ::selection {
        color: palegreen;
        background-color: olive;
      }
    </style>
  </head>

  <body>
    <img
      draggable="false"
      class="bgimg"
      id="sasa"
      src="image/bgimg4.jpg"
      alt=""
    />

    <div class="login-wrapper">
      <h2>註冊 Sign Up</h2>

      <div class="login-form">
        <form id="signup-form" method="POST">
          <div class="input-box">
            <label for="email">電子郵件 Email</label>
            <input
              type="email"
              name="account"
              id="email"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="submit-box">
            <button id="send-verification-btn" type="button">
              發送驗證碼 Send Verification Code
            </button>
          </div>

          <div
            class="input-box"
            id="verification-code-box"
            style="display: none"
          >
            <label for="verification-code">驗證碼 Verification Code</label>
            <div class="verification-actions">
              <input
                type="text"
                id="verification-code"
                name="verificationCode"
                inputmode="numeric"
                autocomplete="one-time-code"
              />
              <button id="verify-code-btn" type="button">
                確認 Verify
              </button>
            </div>
          </div>

          <div id="form-fields" class="form-fields-hidden">
            <div class="input-box">
              <label for="password">密碼 Password</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="new-password"
                minlength="8"
              />

              <div class="password-rules" id="password-rules">
                密碼需至少 8 碼，並包含大寫、小寫與數字。<br />
                Password must be at least 8 characters and include uppercase,
                lowercase, and number.
              </div>
            </div>

            <div class="input-box">
              <label for="phone">電話 Phone</label>
              <input
                type="tel"
                name="phone"
                id="phone"
                placeholder="Enter your phone number"
                autocomplete="tel"
              />
            </div>

            <div class="input-box">
              <label for="name">姓名 Name</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
              />
            </div>

            <div class="input-box">
              <label for="region">地區/國籍 Region (Nationality)</label>
              <select name="region" id="region">
                <option value="">請選擇 Please select</option>
                <option value="TW">台灣 Taiwan</option>
                <option value="CN">中國 China</option>
                <option value="HK">香港 Hong Kong</option>
                <option value="MO">澳門 Macau</option>
                <option value="JP">日本 Japan</option>
                <option value="KR">韓國 South Korea</option>
                <option value="SG">新加坡 Singapore</option>
                <option value="MY">馬來西亞 Malaysia</option>
                <option value="TH">泰國 Thailand</option>
                <option value="PH">菲律賓 Philippines</option>
                <option value="ID">印尼 Indonesia</option>
                <option value="VN">越南 Vietnam</option>
                <option value="US">美國 United States</option>
                <option value="CA">加拿大 Canada</option>
                <option value="UK">英國 United Kingdom</option>
                <option value="AU">澳洲 Australia</option>
                <option value="NZ">紐西蘭 New Zealand</option>
                <option value="DE">德國 Germany</option>
                <option value="FR">法國 France</option>
                <option value="IT">義大利 Italy</option>
                <option value="ES">西班牙 Spain</option>
                <option value="NL">荷蘭 Netherlands</option>
                <option value="BE">比利時 Belgium</option>
                <option value="CH">瑞士 Switzerland</option>
                <option value="AT">奧地利 Austria</option>
                <option value="SE">瑞典 Sweden</option>
                <option value="NO">挪威 Norway</option>
                <option value="DK">丹麥 Denmark</option>
                <option value="FI">芬蘭 Finland</option>
                <option value="PL">波蘭 Poland</option>
                <option value="CZ">捷克 Czech Republic</option>
                <option value="RU">俄羅斯 Russia</option>
                <option value="BR">巴西 Brazil</option>
                <option value="AR">阿根廷 Argentina</option>
                <option value="MX">墨西哥 Mexico</option>
                <option value="IN">印度 India</option>
                <option value="OTHER">其他 Other</option>
              </select>
            </div>

            <div class="submit-box">
              <button type="submit" id="submit-btn">註冊 Sign Up</button>
            </div>
          </div>
        </form>

        <div class="sub-actions">
          <a href="login.html" class="fp">
            已有帳號？回到登入 Already have an account? Back to Login
          </a>
        </div>
      </div>

      <div id="signup-status"></div>
    </div>

    <a href="index.html">
      <div class="back">回主頁 Back</div>
    </a>

    <script>
      const SIGNUP_API_URL =
        "https://script.google.com/macros/s/AKfycbzPTDMCkmIkFlH6HQSEP72Bn2ffOXWcnH6hRPx6FSsQ0NkPZpX2ZumWS-VjYuErUL93Og/exec";

      const signupForm = document.getElementById("signup-form");
      const submitBtn = document.getElementById("submit-btn");
      const statusBox = document.getElementById("signup-status");
      const sendVerificationBtn = document.getElementById(
        "send-verification-btn",
      );
      const emailInput = document.getElementById("email");
      const verificationCodeBox = document.getElementById(
        "verification-code-box",
      );
      const verificationCodeInput =
        document.getElementById("verification-code");
      const verifyCodeBtn = document.getElementById("verify-code-btn");
      const formFields = document.getElementById("form-fields");

      let submitted = false;
      let timeoutTimer = null;
      let verificationEmail = "";
      let isVerified = false;

      function showStatus(message) {
        if (!statusBox) return;
        statusBox.style.display = "block";
        statusBox.textContent = message;
      }

      function hideStatus() {
        if (!statusBox) return;
        statusBox.style.display = "none";
      }

      function resetButton() {
        submitBtn.disabled = false;
        submitBtn.textContent = "註冊 Sign Up";
      }

      function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      function validatePassword(password) {
        const value = String(password || "");

        if (value.length < 8) {
          return "密碼至少需要 8 碼 Password must be at least 8 characters.";
        }

        if (!/[A-Z]/.test(value)) {
          return "密碼至少需要一個大寫英文字母 Password needs one uppercase letter.";
        }

        if (!/[a-z]/.test(value)) {
          return "密碼至少需要一個小寫英文字母 Password needs one lowercase letter.";
        }

        if (!/[0-9]/.test(value)) {
          return "密碼至少需要一個數字 Password needs one number.";
        }

        return "";
      }

      document.getElementById("password").addEventListener("input", function () {
        const passwordInput = document.getElementById("password");
        const passwordRules = document.getElementById("password-rules");
        const error = validatePassword(passwordInput.value);

        if (!passwordInput.value) {
          passwordRules.style.color = "plum";
          passwordRules.innerHTML =
            "密碼需至少 8 碼，並包含大寫、小寫與數字。<br />Password must be at least 8 characters and include uppercase, lowercase, and number.";
          return;
        }

        if (error) {
          passwordRules.style.color = "plum";
          passwordRules.textContent = error;
        } else {
          passwordRules.style.color = "darkgreen";
          passwordRules.textContent = "密碼格式正確 Password format valid.";
        }
      });

      async function postToSignupApi(params) {
        const response = await fetch(SIGNUP_API_URL, {
          redirect: "follow",
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: params.toString(),
        });

        const raw = await response.text();
        try {
          return raw ? JSON.parse(raw) : {};
        } catch (error) {
          console.error("Signup API non-JSON response:", response.status, raw);
          throw new Error(
            "Server returned non-JSON response. Please check Apps Script deployment.",
          );
        }
      }

      function resetVerificationState() {
        isVerified = false;
        verificationEmail = "";
        verificationCodeInput.value = "";
        verificationCodeBox.style.display = "none";
        formFields.classList.remove("form-fields-visible");
        formFields.classList.add("form-fields-hidden");
        document.getElementById("password").required = false;
        document.getElementById("phone").required = false;
        document.getElementById("name").required = false;
        document.getElementById("region").required = false;
      }

      emailInput.addEventListener("input", function () {
        if (isVerified || verificationEmail) {
          resetVerificationState();
          hideStatus();
        }
      });

      // Step 1: Send verification code
      sendVerificationBtn.addEventListener("click", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
          alert("請輸入您的電子郵件 Please enter your email");
          return;
        }

        if (!isValidEmail(email)) {
          alert("請輸入有效的電子郵件格式 Please enter a valid email format");
          return;
        }

        try {
          sendVerificationBtn.disabled = true;
          sendVerificationBtn.textContent = "發送中... Sending...";

          const params = new URLSearchParams({
            action: "signup_send_email",
            account: email,
          });

          const data = await postToSignupApi(params);

          if (data.success) {
            alert(
              "驗證碼已發送至您的電子郵件 Verification code sent to your email",
            );
            verificationEmail = email;
            isVerified = false;

            verificationCodeBox.style.display = "flex";
            verificationCodeInput.focus();
            showStatus(
              "驗證碼已寄出，請於 10 分鐘內輸入。\nVerification code sent. Please enter it within 10 minutes.",
            );
          } else {
            alert(
              data.message ||
                data.error ||
                "發送驗證碼失敗，請稍後再試 Failed to send verification code, please try again later",
            );
          }
        } catch (error) {
          alert("網絡錯誤，請稍後再試 Network error, please try again later");
          console.error("Send verification error:", error);
        } finally {
          sendVerificationBtn.disabled = false;
          sendVerificationBtn.textContent = "發送驗證碼 Send Verification Code";
        }
      });

      // Step 2: Verify code and show remaining form fields
      async function verifyCode() {
        const email = emailInput.value.trim().toLowerCase();
        const code = verificationCodeInput.value.trim();

        if (!verificationEmail || email !== verificationEmail) {
          alert(
            "Email 已變更，請重新發送驗證碼 Email changed. Please send a new verification code.",
          );
          resetVerificationState();
          return;
        }

        if (!code) {
          alert("請輸入驗證碼 Please enter verification code");
          return;
        }

        try {
          verifyCodeBtn.disabled = true;
          verifyCodeBtn.textContent = "驗證中...";

          const params = new URLSearchParams({
            action: "signup_verify_code",
            account: email,
            token: code,
            verificationCode: code,
          });

          const data = await postToSignupApi(params);

          if (!data.success) {
            alert(data.message || data.error || "驗證失敗 Verification failed.");
            return;
          }

          isVerified = true;
          verificationCodeBox.style.display = "none";
          emailInput.readOnly = true;
          sendVerificationBtn.disabled = true;
          sendVerificationBtn.textContent = "已驗證 Verified";

          formFields.classList.remove("form-fields-hidden");
          formFields.classList.add("form-fields-visible");

          document.getElementById("password").required = true;
          document.getElementById("phone").required = true;
          document.getElementById("name").required = true;
          document.getElementById("region").required = true;

          showStatus(
            "驗證成功！請填寫其他資訊 Verification successful! Please fill in other information",
          );

          setTimeout(() => {
            hideStatus();
          }, 2000);
        } catch (error) {
          alert("網絡錯誤，請稍後再試 Network error, please try again later");
          console.error("Verify code error:", error);
        } finally {
          verifyCodeBtn.disabled = false;
          verifyCodeBtn.textContent = "確認 Verify";
        }
      }

      verifyCodeBtn.addEventListener("click", function () {
        verifyCode();
      });

      // Allow Enter key to verify code
      verificationCodeInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && verificationCodeBox.style.display !== "none") {
          verifyCode();
        }
      });

      // Form submission
      signupForm.addEventListener("submit", function (e) {
        if (!isVerified) {
          e.preventDefault();
          alert("請先驗證您的電子郵件 Please verify your email first");
          return;
        }

        const account = emailInput.value.trim();
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value.trim();
        const name = document.getElementById("name").value.trim();
        const region = document.getElementById("region").value;
        const verificationCode = verificationCodeInput.value.trim();

        if (!account || !password || !phone || !name || !region) {
          e.preventDefault();
          alert("請完整填寫所有欄位 Please fill in all fields");
          return;
        }

        const passwordError = validatePassword(password);
        if (passwordError) {
          e.preventDefault();
          alert(passwordError);
          return;
        }

        if (!verificationCode) {
          e.preventDefault();
          alert("請輸入驗證碼 Please enter verification code");
          return;
        }

        const params = new URLSearchParams({
          action: "register",
          account: account,
          password: password,
          phone: phone,
          name: name,
          region: region,
          token: verificationCode,
          verificationCode: verificationCode,
        });

        e.preventDefault();

        submitted = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "註冊中...";
        showStatus("資料已送出，請稍候...");

        clearTimeout(timeoutTimer);

        postToSignupApi(params)
          .then((data) => {
            clearTimeout(timeoutTimer);

            if (data.success) {
              showStatus("送出完成。\n請到 Users 工作表確認是否新增。");
              alert(
                data.message ||
                  "註冊成功，請登入 Register successful. Please login.",
              );
              setTimeout(() => {
                window.location.href = "login.html";
              }, 1500);
            } else {
              const msg =
                data.message || data.error || "註冊失敗 Register failed.";
              alert(msg);
              showStatus(msg);
              resetButton();
            }
          })
          .catch((error) => {
            clearTimeout(timeoutTimer);
            console.error("Register error:", error);
            const detail = error && error.message ? String(error.message) : "";
            let hint =
              "若為 Failed to fetch：常見為瀏覽器擴充（廣告封鎖）、公司網路阻擋 Google、或 CORS。請試無痕視窗、暫停擴充、換網路或手機熱點。\n";
            hint +=
              "If you see Failed to fetch: try incognito, disable extensions (ad blockers), or another network (e.g. mobile hotspot). Google endpoints may be blocked on some networks.\n";
            const msg = detail
              ? "連線錯誤 / Network error: " + detail + "\n\n" + hint
              : "Network error, please try again later.\n\n" + hint;
            alert(msg);
            showStatus(
              detail
                ? "連線錯誤 / Network error: " + detail
                : "Network error, please try again later.",
            );
            resetButton();
          });

        timeoutTimer = setTimeout(function () {
          if (submitted) {
            showStatus(
              "資料已送出。\n請到 Users 工作表確認是否新增。\n如果沒有新增，請確認 Apps Script 部署網址是否正確。",
            );
            // Don't auto-reset, keep the form as is
          }
        }, 10000);
      });
    </script>
  </body>
</html>
