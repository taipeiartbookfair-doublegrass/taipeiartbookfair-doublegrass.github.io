<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; 
         script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://code.jquery.com https://www.googletagmanager.com; 
         style-src 'self' 'unsafe-inline'; 
         connect-src https://www.google-analytics.com https://script.google.com https://script.googleusercontent.com;
         frame-src https://www.google.com;"
    />
    <title>Sign Up - 草率季Taipei Art Book Fair</title>

    <style>
      body {
        font-family: sans-serif;
        background: #f2f2f2;
        padding: 40px;
      }

      form {
        width: 360px;
        padding: 12px;
        border: 1px solid #000;
        background: #fff;
      }

      label {
        display: block;
        margin-top: 10px;
        font-size: 13px;
      }

      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 4px;
      }

      button {
        margin-top: 16px;
        background: #000;
        color: #fff;
        border: 0;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h2>註冊 Sign Up</h2>

    <form
      method="POST"
      action="https://script.google.com/macros/s/AKfycbzFcB-51_7szybY7ayzBlAHERAeN2IX1C1O_2nCIW1C2kJ5nWvAIHn8_oMzZfBe1ZYb/exec"
      target="_blank"
    >
      <input type="hidden" name="action" value="register" />

      <label>Email / account</label>
      <input
        type="email"
        name="account"
        value="test_static_002@example.com"
        required
      />

      <label>Password</label>
      <input
        type="password"
        name="password"
        value="123456"
        required
      />

      <label>Phone</label>
      <input
        type="text"
        name="phone"
        value="0912345678"
        required
      />

      <label>Name</label>
      <input
        type="text"
        name="name"
        value="靜態網站測試"
        required
      />

      <label>Region</label>
      <select name="region" required>
        <option value="TW" selected>TW</option>
        <option value="JP">JP</option>
        <option value="KR">KR</option>
        <option value="IT">IT</option>
        <option value="OTHER">OTHER</option>
      </select>

      <button type="submit">送出測試</button>
    </form>
  </body>
</html>
