<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up - 草率季Taipei Art Book Fair</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
        position: relative;
        background-color: #f2f2f2;
      }

      .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 80vh;
        padding: 0 10px;
      }

      h2 {
        font-size: 1rem;
        font-weight: normal;
        text-transform: uppercase;
        margin-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        color: black;
        background-color: ghostwhite;
        border: 1px solid black;
        text-align: left;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 380px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
      }

      .input-box {
        display: flex;
        flex-direction: column;
        margin-bottom: 8px;
        padding: 4px;
        border: 1px solid #000;
      }

      .input-box label {
        font-size: 12px;
        color: black;
        margin-bottom: 2px;
      }

      .input-box input,
      .input-box select {
        padding: 6px;
        font-size: 12px;
        border: 1px solid #000;
      }

      .input-box input:focus,
      .input-box select:focus {
        background-color: olive;
        outline: none;
      }

      .submit-box {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      button {
        padding: 8px;
        background-color: black;
        color: white;
        border: none;
        width: 100%;
        text-align: center;
        cursor: pointer;
        letter-spacing: 1px;
        font-size: 0.9rem;
      }

      button:hover {
        color: palegreen;
        background-color: olive;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .sub-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
        padding-right: 6px;
      }

      .fp {
        padding-left: 5px;
        padding-right: 5px;
        font-size: 0.8rem;
        text-decoration: underline;
        color: grey;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .back {
        font-size: 0.9rem;
        font-family: "Inclusive Sans", sans-serif;
        overflow: hidden;
        color: black;
        background-color: white;
        white-space: nowrap;
        position: fixed;
        bottom: 0px;
        left: 0px;
        padding: 5px;
        text-align: center;
        font-weight: 500;
        cursor: pointer;
      }

      .status {
        display: none;
        width: 100%;
        max-width: 380px;
        margin-top: 8px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
        color: black;
        font-size: 0.8rem;
        word-break: break-word;
      }

      ::selection {
        color: palegreen;
        background-color: olive;
      }
    </style>
  </head>

  <body>
    <div class="login-wrapper">
      <h2>註冊 Sign Up</h2>

      <div class="login-form">
        <form id="signup-form">
          <div class="input-box">
            <label for="email">電子郵件 Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="your@email.com"
              required
            />
          </div>

          <div class="input-box">
            <label for="password">密碼 Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
              minlength="6"
              required
            />
          </div>

          <div class="input-box">
            <label for="phone">電話 Phone</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="Enter your phone number"
              required
            />
          </div>

          <div class="input-box">
            <label for="name">姓名 Name</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="input-box">
            <label for="region">地區/國籍 Region (Nationality)</label>
            <select name="region" id="region" required>
              <option value="">請選擇 Please select</option>
              <option value="TW">台灣 Taiwan</option>
              <option value="CN">中國 China</option>
              <option value="HK">香港 Hong Kong</option>
              <option value="MO">澳門 Macau</option>
              <option value="JP">日本 Japan</option>
              <option value="KR">韓國 South Korea</option>
              <option value="SG">新加坡 Singapore</option>
              <option value="MY">馬來西亞 Malaysia</option>
              <option value="TH">泰國 Thailand</option>
              <option value="PH">菲律賓 Philippines</option>
              <option value="ID">印尼 Indonesia</option>
              <option value="VN">越南 Vietnam</option>
              <option value="US">美國 United States</option>
              <option value="CA">加拿大 Canada</option>
              <option value="UK">英國 United Kingdom</option>
              <option value="AU">澳洲 Australia</option>
              <option value="NZ">紐西蘭 New Zealand</option>
              <option value="DE">德國 Germany</option>
              <option value="FR">法國 France</option>
              <option value="IT">義大利 Italy</option>
              <option value="ES">西班牙 Spain</option>
              <option value="NL">荷蘭 Netherlands</option>
              <option value="BE">比利時 Belgium</option>
              <option value="CH">瑞士 Switzerland</option>
              <option value="AT">奧地利 Austria</option>
              <option value="SE">瑞典 Sweden</option>
              <option value="NO">挪威 Norway</option>
              <option value="DK">丹麥 Denmark</option>
              <option value="FI">芬蘭 Finland</option>
              <option value="PL">波蘭 Poland</option>
              <option value="CZ">捷克 Czech Republic</option>
              <option value="RU">俄羅斯 Russia</option>
              <option value="BR">巴西 Brazil</option>
              <option value="AR">阿根廷 Argentina</option>
              <option value="MX">墨西哥 Mexico</option>
              <option value="IN">印度 India</option>
              <option value="OTHER">其他 Other</option>
            </select>
          </div>

          <div class="submit-box">
            <button type="submit" id="submit-btn">註冊 Sign Up</button>
          </div>
        </form>

        <div class="sub-actions">
          <a href="#" class="fp" onclick="goLogin(); return false;">
            已有帳號？回到登入 Already have an account? Back to Login
          </a>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>

    <a href="#" onclick="goHome(); return false;">
      <div class="back">回主頁 Back</div>
    </a>

    <script>
      const signupForm = document.getElementById("signup-form");
      const submitBtn = document.getElementById("submit-btn");
      const statusBox = document.getElementById("status");

      function showStatus(message) {
        statusBox.style.display = "block";
        statusBox.textContent = message;
      }

      function resetButton() {
        submitBtn.disabled = false;
        submitBtn.textContent = "註冊 Sign Up";
      }

      function goLogin() {
        alert("這是 Apps Script 註冊頁。請改成你的正式 login.html 網址。");
      }

      function goHome() {
        alert("這是 Apps Script 註冊頁。請改成你的正式首頁網址。");
      }

      signupForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const account = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value.trim();
        const name = document.getElementById("name").value.trim();
        const region = document.getElementById("region").value;

        if (!account || !password || !phone || !name || !region) {
          alert("請完整填寫所有欄位");
          return;
        }

        if (password.length < 6) {
          alert("密碼至少需要 6 碼");
          return;
        }

        const formData = {
          account: account,
          password: password,
          phone: phone,
          name: name,
          region: region,
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "註冊中...";
        showStatus("資料送出中，請稍候...");

        google.script.run
          .withSuccessHandler(function (res) {
            console.log("registerFromPage response:", res);

            if (res && res.success) {
              try {
                localStorage.setItem("token", res.token);
              } catch (err) {}

              showStatus("註冊成功，application_id：" + res.user.application_id);
              alert("註冊成功");

              // 正式上線時，如果 login.html 是外部網站，改這裡：
              // window.top.location.href = "https://你的網站/login.html";

            } else {
              showStatus(res && res.message ? res.message : "註冊失敗");
              alert(res && res.message ? res.message : "註冊失敗");
            }

            resetButton();
          })
          .withFailureHandler(function (err) {
            console.error("registerFromPage error:", err);
            showStatus("系統錯誤：" + err.message);
            alert("系統錯誤：" + err.message);
            resetButton();
          })
          .registerFromPage(formData);
      });
    </script>
  </body>
</html>
