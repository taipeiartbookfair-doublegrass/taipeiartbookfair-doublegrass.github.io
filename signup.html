<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
         script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://code.jquery.com https://www.googletagmanager.com;
         style-src 'self' 'unsafe-inline';
         img-src 'self' data: blob:;
         connect-src https://www.google-analytics.com https://script.google.com https://script.googleusercontent.com;
         frame-src https://www.google.com https://script.google.com https://script.googleusercontent.com;"
    />

    <title>Sign Up - 草率季Taipei Art Book Fair</title>

    <link rel="shortcut icon" href="image/icon-1.ico" />
    <link rel="stylesheet" href="css/font.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-EPSXJPDH6L"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-EPSXJPDH6L");
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        overflow: hidden;
        position: relative;
        background-color: #f2f2f2;
      }

      .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 80vh;
        padding: 0 10px;
      }

      h2 {
        font-size: 1rem;
        font-weight: normal;
        text-transform: uppercase;
        margin-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
        color: black;
        background-color: ghostwhite;
        border: 1px solid black;
        text-align: left;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 380px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
      }

      .input-box {
        display: flex;
        flex-direction: column;
        margin-bottom: 8px;
        padding: 4px;
        border: 1px solid #000;
      }

      .input-box label {
        font-size: 12px;
        color: black;
        margin-bottom: 2px;
      }

      .input-box input,
      .input-box select {
        padding: 6px;
        font-size: 12px;
        border: 1px solid #000;
      }

      .input-box input:focus,
      .input-box select:focus {
        background-color: olive;
        outline: none;
      }

      .sub-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
        padding-right: 6px;
      }

      .fp {
        padding-left: 5px;
        padding-right: 5px;
        font-size: 0.8rem;
        text-decoration: underline;
        color: grey;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .submit-box {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      button {
        padding: 8px;
        background-color: black;
        color: white;
        border: none;
        width: 100%;
        text-align: center;
        cursor: pointer;
        letter-spacing: 1px;
        font-size: 0.9rem;
      }

      button:hover {
        color: palegreen;
        background-color: olive;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .bgimg {
        filter: saturate(500) hue-rotate(185deg) contrast(200%) brightness(90%)
          sepia(25%);
        position: fixed;
        z-index: -50;
        width: 100vw;
        height: 100vh;
        -webkit-user-drag: none;
        top: 0;
        left: 0;
      }

      .back {
        font-size: 0.9rem;
        font-family: "Inclusive Sans", sans-serif;
        overflow: hidden;
        color: black;
        background-color: white;
        white-space: nowrap;
        position: fixed;
        bottom: 0px;
        left: 0px;
        padding: 5px;
        text-align: center;
        font-weight: 500;
        cursor: pointer;
      }

      #signup-status {
        display: none;
        width: 100%;
        max-width: 380px;
        margin-top: 8px;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid black;
        background-color: ghostwhite;
        color: black;
        font-size: 0.8rem;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .password-rules {
        font-size: 0.72rem;
        line-height: 1.35;
        margin-top: 4px;
        color: plum;
      }

      ::selection {
        color: palegreen;
        background-color: olive;
      }
    </style>
  </head>

  <body>
    <img
      draggable="false"
      class="bgimg"
      id="sasa"
      src="image/bgimg4.jpg"
      alt=""
    />

    <div class="login-wrapper">
      <h2>註冊 Sign Up</h2>

      <div class="login-form">
        <form id="signup-form" method="POST">
          <div class="input-box">
            <label for="email">電子郵件 Email</label>
            <input
              type="email"
              name="account"
              id="email"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="input-box">
            <label for="password">密碼 Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="new-password"
              minlength="8"
              required
            />

            <div class="password-rules" id="password-rules">
              密碼需至少 8 碼，並包含大寫、小寫與數字。<br />
              Password must be at least 8 characters and include uppercase,
              lowercase, and number.
            </div>
          </div>

          <div class="input-box">
            <label for="phone">電話 Phone</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="Enter your phone number"
              autocomplete="tel"
              required
            />
          </div>

          <div class="input-box">
            <label for="name">姓名 Name</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Enter your name"
              autocomplete="name"
              required
            />
          </div>

          <div class="input-box">
            <label for="region">地區/國籍 Region (Nationality)</label>
            <select name="region" id="region" required>
              <option value="">請選擇 Please select</option>
              <option value="TW">台灣 Taiwan</option>
              <option value="CN">中國 China</option>
              <option value="HK">香港 Hong Kong</option>
              <option value="MO">澳門 Macau</option>
              <option value="JP">日本 Japan</option>
              <option value="KR">韓國 South Korea</option>
              <option value="SG">新加坡 Singapore</option>
              <option value="MY">馬來西亞 Malaysia</option>
              <option value="TH">泰國 Thailand</option>
              <option value="PH">菲律賓 Philippines</option>
              <option value="ID">印尼 Indonesia</option>
              <option value="VN">越南 Vietnam</option>
              <option value="US">美國 United States</option>
              <option value="CA">加拿大 Canada</option>
              <option value="UK">英國 United Kingdom</option>
              <option value="AU">澳洲 Australia</option>
              <option value="NZ">紐西蘭 New Zealand</option>
              <option value="DE">德國 Germany</option>
              <option value="FR">法國 France</option>
              <option value="IT">義大利 Italy</option>
              <option value="ES">西班牙 Spain</option>
              <option value="NL">荷蘭 Netherlands</option>
              <option value="BE">比利時 Belgium</option>
              <option value="CH">瑞士 Switzerland</option>
              <option value="AT">奧地利 Austria</option>
              <option value="SE">瑞典 Sweden</option>
              <option value="NO">挪威 Norway</option>
              <option value="DK">丹麥 Denmark</option>
              <option value="FI">芬蘭 Finland</option>
              <option value="PL">波蘭 Poland</option>
              <option value="CZ">捷克 Czech Republic</option>
              <option value="RU">俄羅斯 Russia</option>
              <option value="BR">巴西 Brazil</option>
              <option value="AR">阿根廷 Argentina</option>
              <option value="MX">墨西哥 Mexico</option>
              <option value="IN">印度 India</option>
              <option value="OTHER">其他 Other</option>
            </select>
          </div>

          <div class="submit-box">
            <button type="submit" id="submit-btn">註冊 Sign Up</button>
          </div>
        </form>

        <div class="sub-actions">
          <a href="login.html" class="fp">
            已有帳號？回到登入 Already have an account? Back to Login
          </a>
        </div>
      </div>

      <div id="signup-status"></div>
    </div>

    <a href="index.html">
      <div class="back">回主頁 Back</div>
    </a>

    <script>
      const SIGNUP_API_URL =
        "https://script.google.com/macrohttps://script.google.com/macros/s/AKfycbw85GvBeDwTM3ChaUR1ZU0jAInYO4-t5q1QpyU2-NGZwpj4o05wnuXMkQpCHNVqkrqriA/execs/s/AKfycbx44w8jODn0XDAJJAZrNlGSL65driw3rVp4TYVjcZLCNwEupKUI7JC_eJDZbd_8wfpI/exechttps://script.google.com/macros/s/AKfycbxFmbCcSnvYEo16GbyK1HKeX9dui5DTRNVy0gIY2VzvQfSZ_C3_iiKQ2vMY56h5eOBE3g/exec";

      const signupForm = document.getElementById("signup-form");
      const submitBtn = document.getElementById("submit-btn");
      const statusBox = document.getElementById("signup-status");
      const passwordInput = document.getElementById("password");
      const passwordRules = document.getElementById("password-rules");

      function showStatus(message) {
        if (!statusBox) return;
        statusBox.style.display = "block";
        statusBox.textContent = message;
      }

      function resetButton() {
        submitBtn.disabled = false;
        submitBtn.textContent = "註冊 Sign Up";
      }

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
      }

      function validatePassword(password) {
        const value = String(password || "");

        if (value.length < 8) {
          return "密碼至少需要 8 碼 Password must be at least 8 characters.";
        }

        if (!/[A-Z]/.test(value)) {
          return "密碼至少需要一個大寫英文字母 Password needs one uppercase letter.";
        }

        if (!/[a-z]/.test(value)) {
          return "密碼至少需要一個小寫英文字母 Password needs one lowercase letter.";
        }

        if (!/[0-9]/.test(value)) {
          return "密碼至少需要一個數字 Password needs one number.";
        }

        return "";
      }

      passwordInput.addEventListener("input", function () {
        const error = validatePassword(passwordInput.value);

        if (!passwordInput.value) {
          passwordRules.style.color = "plum";
          passwordRules.innerHTML =
            "密碼需至少 8 碼，並包含大寫、小寫與數字。<br />Password must be at least 8 characters and include uppercase, lowercase, and number.";
          return;
        }

        if (error) {
          passwordRules.style.color = "plum";
          passwordRules.textContent = error;
        } else {
          passwordRules.style.color = "darkgreen";
          passwordRules.textContent = "✓ 密碼格式正確 Password format valid.";
        }
      });

      signupForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const account = document
          .getElementById("email")
          .value.trim()
          .toLowerCase();
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value.trim();
        const name = document.getElementById("name").value.trim();
        const region = document.getElementById("region").value;

        if (!account || !password || !phone || !name || !region) {
          alert("請完整填寫所有欄位 Please complete all fields.");
          return;
        }

        if (!isValidEmail(account)) {
          alert("請輸入有效的 Email Please enter a valid email.");
          return;
        }

        const passwordError = validatePassword(password);
        if (passwordError) {
          alert(passwordError);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "送出中... Sending...";
        showStatus("註冊中，請稍候 Registering, please wait...");

        const params = new URLSearchParams({
          action: "register",
          account: account,
          password: password,
          phone: phone,
          name: name,
          region: region,
        }).toString();

        try {
          const res = await fetch(SIGNUP_API_URL, {
            redirect: "follow",
            method: "POST",
            headers: {
              "Content-Type": "text/plain;charset=utf-8",
            },
            body: params,
          });

          const raw = await res.text();
          let data;
          try {
            data = raw ? JSON.parse(raw) : {};
          } catch (parseErr) {
            const preview = raw.slice(0, 240).replace(/\s+/g, " ");
            const msg =
              "伺服器回傳非 JSON（HTTP " +
              res.status +
              "）。請在 Apps Script「部署」將存取權設為「任何人」，並確認網址為最新部署。\n" +
              "Server returned non-JSON (HTTP " +
              res.status +
              "). Deploy the Web app with access: Anyone (including anonymous).\n" +
              preview;
            console.error("Register non-JSON response:", res.status, raw);
            alert(msg);
            showStatus(msg);
            resetButton();
            return;
          }

          console.log("Register response:", data);

          if (data.success) {
            alert("註冊成功，請登入 Register successful. Please login.");
            window.location.href = "login.html";
          } else {
            const msg =
              data.message || data.error || "註冊失敗 Register failed.";
            alert(msg);
            showStatus(msg);
            resetButton();
          }
        } catch (error) {
          console.error("Register error:", error);
          const detail =
            error && error.message ? String(error.message) : "";
          const msg = detail
            ? "連線錯誤 / Network error: " + detail
            : "Network error, please try again later.";
          alert(msg);
          showStatus(msg);
          resetButton();
        }
      });
    </script>
  </body>
</html>
